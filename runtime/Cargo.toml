[package]
name = "galaxy-runtime"
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Headless native GPU runtime for GALAXY and UFF jobs"

[dependencies]
galaxy-sampler = { path = "../rust" }
wgpu = { version = "=24.0.5", default-features = false, features = ["wgsl", "metal", "dx12"] }
pollster = "=0.4.0"
bytemuck = { version = "=1.21.0", features = ["derive"] }
serde = { version = "=1.0.218", features = ["derive"] }
serde_json = "=1.0.139"
clap = { version = "=4.5.31", features = ["derive"] }
sha2 = "=0.10.8"
png = "=0.17.16"

[build-dependencies]
sha2 = "=0.10.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
