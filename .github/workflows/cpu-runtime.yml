name: Native CPU runtime

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            expected_arch: x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
          - name: macOS ARM64
            runner: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        shell: sh
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -eu
          actual=$(uname -m)
          printf 'runner_arch=%s expected_arch=%s\n' "$actual" "$EXPECTED_ARCH"
          test "$actual" = "$EXPECTED_ARCH"
      - name: Check POSIX runner syntax
        shell: sh
        run: |
          set -eu
          sh -n scripts/test-cpu-runtime.sh
          sh -n scripts/bench-cpu-worker-soa.sh
          if command -v dash >/dev/null 2>&1; then
            dash -n scripts/test-cpu-runtime.sh
            dash -n scripts/bench-cpu-worker-soa.sh
          fi
          grep -Fq 'runs/cpu-runtime-${STAMP}-$$' scripts/test-cpu-runtime.sh
      - name: Test native CPU runtime
        shell: sh
        run: cargo test --manifest-path cpu-runtime/Cargo.toml --locked --offline
      - name: Verify binary identity and CLI boundaries
        shell: sh
        run: |
          set -eu
          cargo build --manifest-path cpu-runtime/Cargo.toml --release --locked --offline
          test -x cpu-runtime/target/release/galaxy-cpu
          cpu-runtime/target/release/galaxy-cpu --help | grep -q 'bench-soa'
          cpu-runtime/target/release/galaxy-cpu --help | grep -q 'bench-soa-pool'
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa-pool --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa-pool --help >/dev/null
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline --bin worker_soa_probe -- --help >/dev/null
          if cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify --frames 1 >/dev/null 2>&1; then
            echo "verify unexpectedly accepted benchmark-only --frames" >&2
            exit 1
          fi
          if cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa --path reference >/dev/null 2>&1; then
            echo "bench-soa unexpectedly accepted --path override" >&2
            exit 1
          fi
          if cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa-pool --path reference >/dev/null 2>&1; then
            echo "bench-soa-pool unexpectedly accepted --path override" >&2
            exit 1
          fi
      - name: Verify exact u64 and parallel invariants
        shell: sh
        run: cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify --workers 4
      - name: Verify GALAXY range command parity
        shell: sh
        run: |
          python3 - <<'PY'
          import subprocess

          binary = "cpu-runtime/target/release/galaxy-cpu"
          base = [binary, "range", "--logical", str(2**64 - 1),
                  "--resident", "257", "--frames", "3", "--seed", "303",
                  "--backend", "lut"]

          def run(start, end):
              output = subprocess.check_output(
                  base + ["--start", str(start), "--end", str(end)], text=True
              ).strip().split("\t")
              assert output[0] == "galaxy.cpu-range.v1"
              assert output[3:5] == [f"start={start}", f"end={end}"]
              assert output[7] == "backend=bam-lut-q30"
              return int(output[8].removeprefix("checksum="), 16)

          full = run(0, 257)
          partial = (run(0, 63) + run(63, 129) + run(129, 257)) % 2**64
          assert full == partial
          PY
      - name: Verify frozen BAM-LUT oracle with live ranges
        if: matrix.expected_arch == 'x86_64'
        shell: sh
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          binary = "cpu-runtime/target/release/galaxy-cpu"
          resident = 8_388_608
          base = [binary, "range", "--logical", str(2**64 - 1),
                  "--resident", str(resident), "--frames", "8", "--seed", "303",
                  "--backend", "lut"]

          def run(start, end):
              fields = subprocess.check_output(
                  base + ["--start", str(start), "--end", str(end)], text=True
              ).strip().split("\t")
              assert fields[0] == "galaxy.cpu-range.v1"
              assert fields[3:5] == [f"start={start}", f"end={end}"]
              assert fields[7] == "backend=bam-lut-q30"
              return int(fields[8].removeprefix("checksum="), 16)

          full = run(0, resident)
          low = run(0, resident // 2)
          high = run(resident // 2, resident)
          combined = (low + high) % 2**64
          assert full == combined == 0x8d6f07bd77e2fc16
          receipt = {
              "schema": "galaxy.cpu-range-frozen-oracle-check.v1",
              "logical_population": str(2**64 - 1),
              "resident_particles": resident,
              "frames": 8,
              "seed": 303,
              "ranges": [[0, resident // 2], [resident // 2, resident]],
              "full_checksum": f"{full:016x}",
              "partition_checksums": [f"{low:016x}", f"{high:016x}"],
              "combined_checksum": f"{combined:016x}",
              "archived_oracle_checksum": "8d6f07bd77e2fc16",
              "verified": True,
          }
          Path("runs/cpu-range-ci").mkdir(parents=True, exist_ok=True)
          Path("runs/cpu-range-ci/frozen-oracle.json").write_text(
              json.dumps(receipt, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: matrix.expected_arch == 'x86_64'
        with:
          name: galaxy-cpu-frozen-range-oracle
          path: runs/cpu-range-ci/frozen-oracle.json
          if-no-files-found: error
      - name: Verify worker-local SoA parity
        shell: sh
        run: |
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline --bin worker_soa_probe -- \
            verify --workers 4 --tile 127
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            verify-soa --workers 4 --tile 127
      - name: Verify persistent SoA parity and scheduling
        shell: sh
        run: |
          set -eu
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            verify-soa-pool --workers 4 --tile 127 --schedule physical-first
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            verify-soa-pool --workers 4 --tile 127 --schedule logical
      - name: Run bounded native CPU receipt benchmark
        shell: sh
        run: |
          mkdir -p runs/cpu-runtime-ci
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            bench \
            --logical 18446744073709551615 \
            --resident 65536 \
            --frames 4 \
            --workers 4 \
            --repeats 2 \
            --seed 303 \
            --receipt runs/cpu-runtime-ci/receipt.json \
            > runs/cpu-runtime-ci/stdout.txt
          cat runs/cpu-runtime-ci/stdout.txt
          cat runs/cpu-runtime-ci/receipt.json
          grep -q '^backend_timing_schedule=interleaved-alternating-v1$' runs/cpu-runtime-ci/stdout.txt
          grep -q '"repeats": 2' runs/cpu-runtime-ci/receipt.json
          grep -q '"lut_error_sample_count": 8193' runs/cpu-runtime-ci/receipt.json
          grep -q '"lut_sampled_max_abs_q30_error": 255' runs/cpu-runtime-ci/receipt.json
          if grep -q '"lut_max_abs_q30_error"' runs/cpu-runtime-ci/receipt.json; then
            echo "receipt retained misleading global LUT maximum field" >&2
            exit 1
          fi
      - name: Run bounded guarded SoA production receipt
        shell: sh
        run: |
          set -eu
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            bench-soa \
            --logical 18446744073709551615 \
            --resident 65536 \
            --frames 4 \
            --workers 4 \
            --tile 127 \
            --repeats 2 \
            --seed 303 \
            --receipt runs/cpu-runtime-ci/soa-receipt.json \
            > runs/cpu-runtime-ci/soa-stdout.txt
          cat runs/cpu-runtime-ci/soa-stdout.txt
          cat runs/cpu-runtime-ci/soa-receipt.json
          grep -q '^execution_mode=worker-local-soa-guarded$' runs/cpu-runtime-ci/soa-stdout.txt
          grep -q '"runtime": "galaxy-cpu"' runs/cpu-runtime-ci/soa-receipt.json
          grep -q '"execution_mode": "worker-local-soa-guarded"' runs/cpu-runtime-ci/soa-receipt.json
          grep -q '"guarded_opt_in": true' runs/cpu-runtime-ci/soa-receipt.json
          grep -q '"tile_particles": 127' runs/cpu-runtime-ci/soa-receipt.json
          canonical=$(grep '"parallel_checksum"' runs/cpu-runtime-ci/receipt.json | tail -n 1 | sed -n 's/.*"parallel_checksum": "\([0-9a-fA-F]*\)".*/\1/p')
          soa=$(sed -n 's/.*"checksum": "\([0-9a-fA-F]*\)".*/\1/p' runs/cpu-runtime-ci/soa-receipt.json)
          test -n "$canonical"
          test "$canonical" = "$soa"
      - name: Run bounded persistent SoA production receipt
        shell: sh
        run: |
          set -eu
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            bench-soa-pool \
            --logical 18446744073709551615 \
            --resident 65536 \
            --frames 4 \
            --workers 4 \
            --tile 127 \
            --schedule physical-first \
            --repeats 2 \
            --seed 303 \
            --receipt runs/cpu-runtime-ci/pool-receipt.json \
            > runs/cpu-runtime-ci/pool-stdout.txt
          cat runs/cpu-runtime-ci/pool-stdout.txt
          cat runs/cpu-runtime-ci/pool-receipt.json
          grep -q '^execution_mode=worker-local-soa-persistent$' runs/cpu-runtime-ci/pool-stdout.txt
          grep -q '"schema": "galaxy.cpu-runtime-persistent-soa-receipt.v1"' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"runtime": "galaxy-cpu"' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"execution_mode": "worker-local-soa-persistent"' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"schedule_policy": "physical-first"' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"worker_threads_persistent_across_trials": true' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"worker_thread_creation_in_timed_region": false' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"worker_local_tile_buffers_reused": true' runs/cpu-runtime-ci/pool-receipt.json
          grep -q '"pool_dispatches": 3' runs/cpu-runtime-ci/pool-receipt.json
          canonical=$(grep '"parallel_checksum"' runs/cpu-runtime-ci/receipt.json | tail -n 1 | sed -n 's/.*"parallel_checksum": "\([0-9a-fA-F]*\)".*/\1/p')
          pooled=$(sed -n 's/.*"checksum": "\([0-9a-fA-F]*\)".*/\1/p' runs/cpu-runtime-ci/pool-receipt.json)
          test -n "$canonical"
          test "$canonical" = "$pooled"

  windows-x64:
    name: Windows x86-64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          Write-Host "runner_arch=$arch expected_arch=X64"
          if ($arch -ne 'X64') { throw "Expected native X64 runner" }
      - name: Test native CPU runtime
        shell: pwsh
        run: cargo test --manifest-path cpu-runtime/Cargo.toml --locked --offline
      - name: Verify binary identity and CLI boundaries
        shell: pwsh
        run: |
          cargo build --manifest-path cpu-runtime/Cargo.toml --release --locked --offline
          if (-not (Test-Path 'cpu-runtime/target/release/galaxy-cpu.exe')) { throw "galaxy-cpu.exe was not built" }
          $help = & 'cpu-runtime/target/release/galaxy-cpu.exe' --help
          if ($LASTEXITCODE -ne 0) { throw "galaxy-cpu.exe --help failed" }
          if (-not ($help -match 'bench-soa')) { throw "galaxy-cpu help omitted bench-soa" }
          if (-not ($help -match 'bench-soa-pool')) { throw "galaxy-cpu help omitted bench-soa-pool" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bench --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "verify --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bench-soa --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "verify-soa --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa-pool --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "bench-soa-pool --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa-pool --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "verify-soa-pool --help failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline --bin worker_soa_probe -- --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "worker_soa_probe --help failed" }
          $probe = Start-Process -FilePath cargo -ArgumentList @(
            'run', '--manifest-path', 'cpu-runtime/Cargo.toml', '--release', '--locked', '--offline',
            '--', 'verify', '--frames', '1'
          ) -NoNewWindow -Wait -PassThru
          if ($probe.ExitCode -eq 0) { throw "verify unexpectedly accepted benchmark-only --frames" }
          $soaOverride = Start-Process -FilePath cargo -ArgumentList @(
            'run', '--manifest-path', 'cpu-runtime/Cargo.toml', '--release', '--locked', '--offline',
            '--', 'bench-soa', '--path', 'reference'
          ) -NoNewWindow -Wait -PassThru
          if ($soaOverride.ExitCode -eq 0) { throw "bench-soa unexpectedly accepted --path override" }
          $poolOverride = Start-Process -FilePath cargo -ArgumentList @(
            'run', '--manifest-path', 'cpu-runtime/Cargo.toml', '--release', '--locked', '--offline',
            '--', 'bench-soa-pool', '--path', 'reference'
          ) -NoNewWindow -Wait -PassThru
          if ($poolOverride.ExitCode -eq 0) { throw "bench-soa-pool unexpectedly accepted --path override" }
      - name: Verify exact u64 and parallel invariants
        shell: pwsh
        run: cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify --workers 4
      - name: Verify worker-local SoA parity
        shell: pwsh
        run: |
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline --bin worker_soa_probe -- verify --workers 4 --tile 127
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa --workers 4 --tile 127
      - name: Verify persistent SoA parity and scheduling
        shell: pwsh
        run: |
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa-pool --workers 4 --tile 127 --schedule physical-first
          if ($LASTEXITCODE -ne 0) { throw "physical-first persistent verification failed" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-soa-pool --workers 4 --tile 127 --schedule logical
          if ($LASTEXITCODE -ne 0) { throw "logical persistent verification failed" }
      - name: Run bounded native CPU receipt benchmark
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runs/cpu-runtime-ci | Out-Null
          $output = cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench --logical 18446744073709551615 --resident 65536 --frames 4 --workers 4 --repeats 2 --seed 303 --receipt runs/cpu-runtime-ci/receipt.json
          $output | Set-Content runs/cpu-runtime-ci/stdout.txt
          $output
          Get-Content runs/cpu-runtime-ci/receipt.json
          if (-not ($output -contains 'backend_timing_schedule=interleaved-alternating-v1')) { throw "Benchmark did not report interleaved backend timing schedule" }
          $receipt = Get-Content runs/cpu-runtime-ci/receipt.json -Raw | ConvertFrom-Json
          if ($receipt.repeats -ne 2) { throw "Receipt did not preserve repeats=2" }
          if ($receipt.lut_error_sample_count -ne 8193) { throw "Receipt did not preserve LUT sample count" }
          if ($receipt.lut_sampled_max_abs_q30_error -ne 255) { throw "Receipt sampled LUT diagnostic changed unexpectedly" }
          if ($null -ne $receipt.lut_max_abs_q30_error) { throw "Receipt retained misleading global LUT maximum field" }
      - name: Run bounded guarded SoA production receipt
        shell: pwsh
        run: |
          $output = cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa --logical 18446744073709551615 --resident 65536 --frames 4 --workers 4 --tile 127 --repeats 2 --seed 303 --receipt runs/cpu-runtime-ci/soa-receipt.json
          $output | Set-Content runs/cpu-runtime-ci/soa-stdout.txt
          $output
          $soa = Get-Content runs/cpu-runtime-ci/soa-receipt.json -Raw | ConvertFrom-Json
          $canonical = Get-Content runs/cpu-runtime-ci/receipt.json -Raw | ConvertFrom-Json
          if ($soa.runtime -ne 'galaxy-cpu') { throw "SoA receipt runtime identity changed" }
          if ($soa.execution_mode -ne 'worker-local-soa-guarded') { throw "SoA execution mode changed" }
          if (-not $soa.guarded_opt_in) { throw "SoA receipt lost guarded opt-in marker" }
          if ($soa.tile_particles -ne 127) { throw "SoA receipt did not preserve tile size" }
          if ($soa.checksum -ne $canonical.bam_lut.parallel_checksum) { throw "Guarded SoA checksum diverged from canonical BAM-LUT" }
      - name: Run bounded persistent SoA production receipt
        shell: pwsh
        run: |
          $output = cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-soa-pool --logical 18446744073709551615 --resident 65536 --frames 4 --workers 4 --tile 127 --schedule physical-first --repeats 2 --seed 303 --receipt runs/cpu-runtime-ci/pool-receipt.json
          $output | Set-Content runs/cpu-runtime-ci/pool-stdout.txt
          $output
          $pool = Get-Content runs/cpu-runtime-ci/pool-receipt.json -Raw | ConvertFrom-Json
          $canonical = Get-Content runs/cpu-runtime-ci/receipt.json -Raw | ConvertFrom-Json
          if ($pool.schema -ne 'galaxy.cpu-runtime-persistent-soa-receipt.v1') { throw "Persistent receipt schema changed" }
          if ($pool.runtime -ne 'galaxy-cpu') { throw "Persistent receipt runtime identity changed" }
          if ($pool.execution_mode -ne 'worker-local-soa-persistent') { throw "Persistent execution mode changed" }
          if ($pool.schedule_policy -ne 'physical-first') { throw "Persistent scheduling policy changed" }
          if (-not $pool.worker_threads_persistent_across_trials) { throw "Persistent receipt lost pool reuse marker" }
          if ($pool.worker_thread_creation_in_timed_region) { throw "Persistent timing unexpectedly includes thread creation" }
          if (-not $pool.worker_local_tile_buffers_reused) { throw "Persistent receipt lost tile reuse marker" }
          if ($pool.pool_dispatches -ne 3) { throw "Persistent receipt dispatch count changed" }
          if ($pool.checksum -ne $canonical.bam_lut.parallel_checksum) { throw "Persistent SoA checksum diverged from canonical BAM-LUT" }
