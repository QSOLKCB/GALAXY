name: Deploy GALAXY to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: galaxy-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Rust and browser application
        run: |
          cargo test --manifest-path rust/Cargo.toml --locked --offline
          bash scripts/build-wasm.sh
          git diff --exit-code -- wasm/ data/uff-demo.js rust/src/uff_data.rs
          node tests/smoke.mjs
          node tests/physics.mjs
          node tests/app.mjs
          node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
