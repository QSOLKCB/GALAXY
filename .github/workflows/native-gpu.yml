name: Native GPU runtime

on:
  push:
    branches: [main]
    paths: ['runtime/**', 'rust/**', 'nbody/**', 'data/uff/**', 'tests/uff-reference.json', 'tests/test_bh2d_hardware_sweep.py', 'scripts/*gpu*', 'scripts/bench-bh2d-hardware.py', 'scripts/vast-runner.py', 'rust-toolchain.toml', '.github/workflows/native-gpu.yml', '.dockerignore', 'LICENSE', 'NOTICE.md']
  pull_request:
    paths: ['runtime/**', 'rust/**', 'nbody/**', 'data/uff/**', 'tests/uff-reference.json', 'tests/test_bh2d_hardware_sweep.py', 'scripts/*gpu*', 'scripts/bench-bh2d-hardware.py', 'scripts/vast-runner.py', 'rust-toolchain.toml', '.github/workflows/native-gpu.yml', '.dockerignore', 'LICENSE', 'NOTICE.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check SSH runner and result extraction on Windows
        run: python runtime/tests/test_runner.py

  runner-python:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check SSH runner across supported Python versions
        run: python runtime/tests/test_runner.py

  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: native-gpu-${{ runner.os }}-rust-1.85.1-${{ hashFiles('runtime/Cargo.lock') }}
      - name: Native equations, job validation and CLI artifacts
        run: cargo test --manifest-path runtime/Cargo.toml --locked
      - name: Local and SSH runner checks
        run: |
          bash -n scripts/run-gpu.sh scripts/bootstrap-gpu.sh
          python runtime/tests/test_runner.py
          python runtime/cuda/check_barnes_hut_layout.py
          python tests/test_bh2d_hardware_sweep.py
          python scripts/bench-bh2d-hardware.py --dry-run --output "$RUNNER_TEMP/bh2d-plan" --particles 512,4096,8192
      - name: Install software Vulkan for compute validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          python - <<'PY'
          import os
          from pathlib import Path
          driver = next(Path('/usr/share/vulkan/icd.d').glob('*lvp*.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VK_DRIVER_FILES={driver}\n')
          PY
      - name: Execute GPU kernels against UFF and orbital references
        run: cargo run --manifest-path runtime/Cargo.toml --locked -- verify --allow-software
      - name: Execute Barnes-Hut flat traversal through Vulkan
        run: |
          cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-bh-gpu -- \
            --particles 256 --theta 0.5 --allow-software \
            --receipt "$RUNNER_TEMP/barnes-hut-gpu.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "barnes-hut-gpu.json").read_text())
          assert receipt["schema"] == "galaxy.barnes-hut-gpu-traversal-receipt.v1"
          assert receipt["phase"] == "BH-2B1"
          assert receipt["packed_transfer_bytes"] > 0
          assert receipt["direct_probe_count"] == 12
          assert receipt["errors"]["gpu_vs_direct_rms_relative"] < 0.04
          assert receipt["errors"]["gpu_vs_direct_max_relative"] < 0.30
          assert receipt["errors"]["gpu_vs_flat_cpu_rms_relative"] < 0.01
          assert receipt["errors"]["gpu_vs_flat_cpu_max_relative"] < 0.10
          PY
      - name: Execute evolving Barnes-Hut self-gravity through Vulkan
        run: |
          cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-bh-evolve -- \
            --preset disc --particles 128 --steps 3 --dt-myr 0.01 \
            --theta 0.5 --allow-software \
            --receipt "$RUNNER_TEMP/barnes-hut-evolve.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "barnes-hut-evolve.json").read_text())
          assert receipt["schema"] == "galaxy.barnes-hut-gpu-evolution-receipt.v1"
          assert receipt["phase"] == "BH-2B2"
          assert receipt["steps"] == 3
          assert receipt["force_solves"] == 4
          assert receipt["host_tree_rebuilds"] == 3
          assert receipt["persistent_gpu_state_bytes"] > 0
          assert receipt["cpu_full_trajectory_reference"]["status"] == "executed"
          err = receipt["cpu_full_trajectory_reference"]["state_error"]
          assert err["position_rms_relative_l2"] < 0.02
          assert err["position_max_relative"] < 0.20
          assert err["velocity_rms_relative_l2"] < 0.02
          assert err["velocity_max_relative"] < 0.20
          force = receipt["final_force_direct_probe"]
          assert force["count"] == 12
          assert force["rms_relative_error"] < 0.04
          assert force["max_relative_error"] < 0.30
          assert receipt["state"]["initial_checksum_fnv_mix64"] != receipt["state"]["final_checksum_fnv_mix64"]
          assert receipt["timings_seconds"]["gpu_kick_drift_dispatch_total"] >= 0
          assert receipt["timings_seconds"]["gpu_final_kick_dispatch_total"] >= 0
          assert receipt["timings_seconds"]["cpu_tree_rebuild_total"] >= 0
          PY
      - name: Execute GPU-built Barnes-Hut tree evolution
        run: |
          cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-bh-gpu-tree -- \
            --preset disc --particles 128 --steps 3 --dt-myr 0.01 \
            --theta 0.5 --allow-software \
            --receipt "$RUNNER_TEMP/barnes-hut-gpu-tree.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "barnes-hut-gpu-tree.json").read_text())
          assert receipt["schema"] == "galaxy.barnes-hut-gpu-tree-evolution-receipt.v1"
          assert receipt["phase"] == "BH-2C"
          assert receipt["builder"] == "gpu-f32-serialized-control-v1"
          assert receipt["host_tree_rebuilds"] == 0
          assert receipt["host_particle_readbacks_during_steps"] == 0
          assert receipt["force_solves"] == 4
          assert receipt["evolution_tree_builds"] == 4
          assert receipt["tree"]["overflow"] == 0
          assert receipt["tree"]["repeat_rebuild_matches"] is True
          assert receipt["tree"]["cell_count"] > 0
          force = receipt["final_force"]
          assert force["gpu_vs_bh2a_flat_rms_relative"] < 0.04
          assert force["gpu_vs_bh2a_flat_max_relative"] < 0.30
          assert force["direct_probe_rms_relative"] < 0.04
          assert force["direct_probe_max_relative"] < 0.30
          state = receipt["trajectory_vs_bh2a_flat_f64"]
          assert state["position_rms_relative_l2"] < 0.03
          assert state["position_max_relative"] < 0.30
          assert state["velocity_rms_relative_l2"] < 0.03
          assert state["velocity_max_relative"] < 0.30
          assert receipt["timings_seconds"]["gpu_tree_build_total"] >= 0
          PY
      - name: Execute parallel GPU-built Barnes-Hut tree evolution
        run: |
          cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-bh-gpu-tree-parallel -- \
            --preset disc --particles 512 --steps 3 --dt-myr 0.01 \
            --theta 0.5 --allow-software \
            --benchmark-warmup 0 --benchmark-repeats 2 \
            --receipt "$RUNNER_TEMP/barnes-hut-gpu-tree-parallel.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ["RUNNER_TEMP"], "barnes-hut-gpu-tree-parallel.json").read_text())
          assert receipt["schema"] == "galaxy.barnes-hut-parallel-gpu-tree-receipt.v1"
          assert receipt["phase"] == "BH-2D"
          assert receipt["builder"] == "gpu-parallel-sparse-radix-v1"
          assert receipt["measurement_class"] == "software-validation"
          assert receipt["hardware_performance_claim_allowed"] is False
          assert receipt["host_tree_rebuilds"] == 0
          assert receipt["host_particle_readbacks_during_steps"] == 0
          assert receipt["force_solves"] == 4
          assert receipt["evolution_tree_builds"] == 4
          assert receipt["tree"]["repeat_rebuild_matches"] is True
          assert receipt["tree"]["active_cell_count"] > 0
          assert receipt["gpu_oracles"]["status"] == "executed"
          force = receipt["final_force"]
          assert force["gpu_vs_bh2a_flat_rms_relative"] < 0.04
          assert force["gpu_vs_bh2a_flat_max_relative"] < 0.30
          assert force["direct_probe_rms_relative"] < 0.04
          assert force["direct_probe_max_relative"] < 0.30
          trajectory = receipt["trajectory_vs_bh2a_flat_f64"]
          assert trajectory["status"] == "executed"
          state = trajectory["state_error"]
          assert state["position_rms_relative_l2"] < 0.03
          assert state["position_max_relative"] < 0.30
          assert state["velocity_rms_relative_l2"] < 0.03
          assert state["velocity_max_relative"] < 0.30
          bench = receipt["tree_build_benchmark"]
          assert bench["sample_scope"].startswith("complete rebuild call")
          assert bench["stage_timings_are_diagnostics"] is True
          assert len(bench["parallel_samples_seconds"]) == 2
          assert bench["bh2c_serial"]["status"] == "executed"
          PY
      - name: Execute an end-to-end headless Vulkan job
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          Path('runtime-smoke.json').write_text(json.dumps({'schema_version': 1, 'task': {'kind': 'spin', 'particles': 8193, 'steps': 4, 'snapshot_every': 2, 'image_size': 128}}))
          PY
          cargo run --manifest-path runtime/Cargo.toml --locked -- run --job runtime-smoke.json --output runs/ci-vulkan --allow-software

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the local and Vast.ai runtime image
        run: docker build -f runtime/Dockerfile -t galaxy-runtime:ci .
      - name: Check the packaged executable and reference data
        run: docker run --rm galaxy-runtime:ci verify --cpu
