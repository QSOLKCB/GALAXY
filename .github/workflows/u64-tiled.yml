name: U64 tiled runtime

on:
  pull_request:
    paths:
      - 'runtime/src/bin/**'
      - 'runtime/cuda/**'
      - 'runtime/build.rs'
      - 'runtime/jobs/beyond-u32.json'
      - 'data/uff/DEMO_GALAXY.csv'
      - 'data/uff/provenance.json'
      - 'scripts/run-u64.sh'
      - 'scripts/bootstrap-cuda.sh'
      - 'tests/test_cuda_u64.py'
      - 'docs/U64-TILED-RUNTIME.md'
      - 'docs/CUDA-RUNTIME.md'
      - 'QBRAID.md'
      - '.github/workflows/u64-tiled.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/src/bin/**'
      - 'runtime/cuda/**'
      - 'runtime/build.rs'
      - 'runtime/jobs/beyond-u32.json'
      - 'data/uff/DEMO_GALAXY.csv'
      - 'data/uff/provenance.json'
      - 'scripts/run-u64.sh'
      - 'scripts/bootstrap-cuda.sh'
      - 'tests/test_cuda_u64.py'
      - 'docs/U64-TILED-RUNTIME.md'
      - 'docs/CUDA-RUNTIME.md'
      - 'QBRAID.md'
      - '.github/workflows/u64-tiled.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u64-tiled-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: u64-tiled-${{ runner.os }}-rust-1.85.1-${{ hashFiles('runtime/Cargo.lock') }}
      - name: Unit and integration tests
        run: cargo test --manifest-path runtime/Cargo.toml --locked
      - name: Validate beyond-u32 workload
        run: cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-u64 -- validate --job runtime/jobs/beyond-u32.json
      - name: Host boundary discriminator
        run: cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-u64 -- verify --cpu
      - name: CUDA backend host contract
        run: |
          python3 -m py_compile runtime/cuda/galaxy_u64_cuda.py runtime/cuda/galaxy_u64_cuda_impl.py
          python3 tests/test_cuda_u64.py
          python3 runtime/cuda/galaxy_u64_cuda.py verify --cpu
          python3 runtime/cuda/galaxy_u64_cuda.py validate --job runtime/jobs/beyond-u32.json
          bash -n scripts/run-u64.sh scripts/bootstrap-cuda.sh

          # The wrapper mutates Vulkan receipt provenance, so it is part of the
          # Rust runtime source identity rather than an untracked launcher detail.
          grep -Fq '"../scripts/run-u64.sh"' runtime/build.rs
          grep -Fq '"backend_requested": "auto"' docs/CUDA-RUNTIME.md
          grep -Fq 'runtime/cuda/galaxy_u64_cuda_impl.py' QBRAID.md

          router_tmp="$(mktemp -d)"
          cat >"$router_tmp/python-stub" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "${GALAXY_BACKEND_REQUESTED:-missing}"
          SH
          chmod +x "$router_tmp/python-stub"

          # Cargo being present must not make an explicit stale/nonexistent ICD
          # count as Vulkan hardware. Auto must reach CUDA and preserve `auto`.
          GALAXY_CARGO=/bin/true \
          GALAXY_CUDA_PYTHON="$router_tmp/python-stub" \
          VK_DRIVER_FILES="$router_tmp/does-not-exist.json" \
            bash scripts/run-u64.sh devices --backend auto >"$router_tmp/stale.out" 2>"$router_tmp/stale.err"
          grep -qx auto "$router_tmp/stale.out"

          cat >"$router_tmp/software.json" <<'JSON'
          {"ICD":{"library_path":"libvulkan_lvp.so"}}
          JSON
          GALAXY_CARGO=/bin/true \
          GALAXY_CUDA_PYTHON="$router_tmp/python-stub" \
          VK_DRIVER_FILES="$router_tmp/software.json" \
            bash scripts/run-u64.sh devices --backend auto >"$router_tmp/software.out" 2>"$router_tmp/software.err"
          grep -qx auto "$router_tmp/software.out"

          # A failed optional vulkaninfo probe plus a failed Rust probe must fall
          # through to CUDA even if the image has stale system ICD configuration.
          cat >"$router_tmp/vulkaninfo" <<'SH'
          #!/usr/bin/env bash
          exit 1
          SH
          chmod +x "$router_tmp/vulkaninfo"
          env -u VK_DRIVER_FILES -u VK_ICD_FILENAMES \
            PATH="$router_tmp:$PATH" \
            GALAXY_CARGO=/bin/true \
            GALAXY_CUDA_PYTHON="$router_tmp/python-stub" \
            bash scripts/run-u64.sh devices --backend auto >"$router_tmp/system.out" 2>"$router_tmp/system.err"
          grep -qx auto "$router_tmp/system.out"
          ! grep -q 'find /usr/share/vulkan/icd.d' scripts/run-u64.sh

          # Conversely, vulkaninfo is optional: GALAXY's own Rust device command
          # may prove a hardware Vulkan adapter and auto must select that backend.
          cat >"$router_tmp/cargo-stub" <<'SH'
          #!/usr/bin/env bash
          if [[ " $* " == *" devices "* ]]; then
            cat <<'JSON'
          [
            {
              "index": 0,
              "name": "Intel Mock Vulkan",
              "backend": "Vulkan",
              "device_type": "IntegratedGpu",
              "software": false
            }
          ]
          JSON
            exit 0
          fi
          output=""
          previous=""
          for arg in "$@"; do
            if [[ "$previous" == "--output" ]]; then output="$arg"; fi
            case "$arg" in --output=*) output="${arg#*=}" ;; esac
            previous="$arg"
          done
          if [[ -n "$output" ]]; then
            mkdir -p "$output"
            cat >"$output/receipt.json" <<'JSON'
          {
            "schema_version": 1,
            "status": "complete",
            "backend_requested": "gpu",
            "allow_software": false
          }
          JSON
          fi
          exit 0
          SH
          chmod +x "$router_tmp/cargo-stub"

          auto_out="$router_tmp/vulkan-auto-run"
          env -u VK_DRIVER_FILES -u VK_ICD_FILENAMES \
            PATH="$router_tmp:$PATH" \
            GALAXY_CARGO="$router_tmp/cargo-stub" \
            GALAXY_CUDA_PYTHON="$router_tmp/python-stub" \
            bash scripts/run-u64.sh run --backend auto --job ignored.json --output "$auto_out"
          python3 - <<PY
          import json
          from pathlib import Path
          receipt = json.loads(Path("$auto_out/receipt.json").read_text())
          assert receipt["backend_requested"] == "auto", receipt
          assert receipt["backend_selected"] == "vulkan", receipt
          PY

          # Adapter selection participates in auto routing. An unrelated Intel
          # Vulkan adapter must not trap a request for an NVIDIA CUDA adapter.
          env -u VK_DRIVER_FILES -u VK_ICD_FILENAMES \
            PATH="$router_tmp:$PATH" \
            GALAXY_CARGO="$router_tmp/cargo-stub" \
            GALAXY_CUDA_PYTHON="$router_tmp/python-stub" \
            bash scripts/run-u64.sh verify --backend auto --adapter NVIDIA >"$router_tmp/adapter.out" 2>"$router_tmp/adapter.err"
          grep -qx auto "$router_tmp/adapter.out"

          forced_out="$router_tmp/vulkan-forced-run"
          GALAXY_CARGO="$router_tmp/cargo-stub" \
            bash scripts/run-u64.sh run --backend vulkan --job ignored.json --output "$forced_out"
          python3 - <<PY
          import json
          from pathlib import Path
          receipt = json.loads(Path("$forced_out/receipt.json").read_text())
          assert receipt["backend_requested"] == "vulkan", receipt
          assert receipt["backend_selected"] == "vulkan", receipt
          PY

          # Relative custom CUDA sites are repository-relative in both the runner
          # and bootstrap, regardless of the caller's current working directory.
          relative_site=".ci-relative-cuda-site"
          expected_site="$GITHUB_WORKSPACE/$relative_site"
          mkdir -p "$expected_site"
          cat >"$router_tmp/pythonpath-stub" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "${PYTHONPATH%%:*}"
          SH
          chmod +x "$router_tmp/pythonpath-stub"
          (
            cd /tmp
            GALAXY_CUDA_SITE="$relative_site" \
            GALAXY_CUDA_PYTHON="$router_tmp/pythonpath-stub" \
              bash "$GITHUB_WORKSPACE/scripts/run-u64.sh" devices --backend cuda
          ) >"$router_tmp/runner-site.out"
          grep -Fx "$expected_site" "$router_tmp/runner-site.out"

          cat >"$router_tmp/nvidia-smi" <<'SH'
          #!/usr/bin/env bash
          echo 'NVIDIA-SMI mock  Driver Version: 999.0  CUDA Version: 13.0'
          SH
          cat >"$router_tmp/bootstrap-python-stub" <<'SH'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-m" ]]; then
            previous=""
            for arg in "$@"; do
              if [[ "$previous" == "--target" ]]; then
                printf '%s\n' "$arg" >"$BOOTSTRAP_TARGET_CAPTURE"
                exit 0
              fi
              previous="$arg"
            done
            exit 2
          fi
          cat >/dev/null
          exit 0
          SH
          chmod +x "$router_tmp/nvidia-smi" "$router_tmp/bootstrap-python-stub"
          (
            cd /tmp
            PATH="$router_tmp:$PATH" \
            GALAXY_CUDA_SITE="$relative_site" \
            GALAXY_CUDA_BOOTSTRAP_PYTHON="$router_tmp/bootstrap-python-stub" \
            BOOTSTRAP_TARGET_CAPTURE="$router_tmp/bootstrap-target" \
              bash "$GITHUB_WORKSPACE/scripts/bootstrap-cuda.sh"
          ) >"$router_tmp/bootstrap.out" 2>"$router_tmp/bootstrap.err"
          grep -Fx "$expected_site" "$router_tmp/bootstrap-target"

          # The real bootstrap must reject a process-visible CUDA device count of
          # zero before printing its success banner.
          grep -Fq 'if count <= 0:' scripts/bootstrap-cuda.sh
          grep -Fq 'no CUDA devices are visible to this process' scripts/bootstrap-cuda.sh

  software-vulkan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            runtime/target
          key: u64-tiled-vulkan-${{ runner.os }}-rust-1.85.1-${{ hashFiles('runtime/Cargo.lock') }}
      - name: Install software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
          python - <<'PY'
          import os
          from pathlib import Path
          driver = next(Path('/usr/share/vulkan/icd.d').glob('*lvp*.json'))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'VK_DRIVER_FILES={driver}\n')
          PY
      - name: Compile u64 runtime
        run: cargo build --manifest-path runtime/Cargo.toml --locked --bin galaxy-u64
      - name: GPU-side 2^32 boundary proof
        run: cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-u64 -- verify --allow-software
      - name: End-to-end multi-tile smoke job
        run: |
          cat >u64-smoke.json <<'JSON'
          {
            "schema_version": 1,
            "task": {
              "logical_particles": 10003,
              "tile_particles": 4096,
              "steps": 4,
              "dt_myr": 0.05,
              "snapshot_every": 2,
              "snapshot_limit": 257,
              "image_size": 128,
              "integrator": "leapfrog",
              "radial_kick_kms": 10.0
            }
          }
          JSON
          cargo run --manifest-path runtime/Cargo.toml --locked --bin galaxy-u64 -- run --allow-software --job u64-smoke.json --output runs/u64-smoke
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('runs/u64-smoke/receipt.json').read_text())
          assert receipt['status'] == 'complete'
          result = receipt['results']
          assert result['logical_particles'] == 10003
          assert result['tiles'] == 3
          assert result['particle_updates'] == 40012
          ids = [int(line.split(',', 1)[0]) for line in Path('runs/u64-smoke/frame-000004.csv').read_text().splitlines()[1:]]
          assert len(ids) == 257
          assert ids == sorted(ids)
          assert len(set(ids)) == len(ids)
          PY
