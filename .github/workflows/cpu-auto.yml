name: CPU host-auto promotion

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cpu-auto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix-auto:
    name: Auto ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            expected_arch: x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
          - name: macOS ARM64
            runner: macos-15
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        shell: sh
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: |
          set -eu
          actual=$(uname -m)
          printf 'runner_arch=%s expected_arch=%s\n' "$actual" "$EXPECTED_ARCH"
          test "$actual" = "$EXPECTED_ARCH"
      - name: Test auto policy unit contracts
        shell: sh
        run: cargo test --manifest-path cpu-runtime/Cargo.toml --locked --offline
      - name: Verify auto CLI boundaries
        shell: sh
        run: |
          set -eu
          cargo build --manifest-path cpu-runtime/Cargo.toml --release --locked --offline
          top_help=$(cpu-runtime/target/release/galaxy-cpu --help)
          printf '%s\n' "$top_help" | grep -q 'bench-auto'
          printf '%s\n' "$top_help" | grep -q 'expands resident work when needed so every advertised tile is measured'
          printf '%s\n' "$top_help" | grep -q 'preserves the requested frame depth during calibration'
          printf '%s\n' "$top_help" | grep -q 'includes topology detection in tuning_ns'
          auto_help=$(cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-auto --help)
          printf '%s\n' "$auto_help" | grep -q 'projects every calibration median to requested particle-frame work'
          printf '%s\n' "$auto_help" | grep -q 'expands resident work when needed so every advertised tile is measured'
          printf '%s\n' "$auto_help" | grep -q 'preserves the requested frame depth during calibration'
          printf '%s\n' "$auto_help" | grep -q 'including worker-local buffer first-touch'
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-auto --help >/dev/null
          for flag in --path --tile --schedule; do
            if cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-auto "$flag" 1 >/dev/null 2>&1; then
              echo "bench-auto unexpectedly accepted $flag" >&2
              exit 1
            fi
          done
      - name: Verify fail-closed auto selection
        shell: sh
        run: |
          set -eu
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-auto --workers 4
      - name: Run bounded auto receipt
        shell: sh
        run: |
          set -eu
          mkdir -p runs/cpu-auto-ci
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- \
            bench-auto \
            --logical 18446744073709551615 \
            --resident 16384 \
            --frames 2 \
            --workers 4 \
            --repeats 2 \
            --seed 303 \
            --receipt runs/cpu-auto-ci/receipt.json \
            > runs/cpu-auto-ci/stdout.txt
          cat runs/cpu-auto-ci/stdout.txt
          cat runs/cpu-auto-ci/receipt.json
          grep -q '^execution_mode=host-auto$' runs/cpu-auto-ci/stdout.txt
          grep -q '^selection_policy=calibrated-host-auto-v1$' runs/cpu-auto-ci/stdout.txt
          grep -q '^score_projection=linear-particle-frame-v1$' runs/cpu-auto-ci/stdout.txt
          grep -q '^tile_shape_policy=expand-resident-for-effective-tile-v1$' runs/cpu-auto-ci/stdout.txt
          grep -q '^frame_calibration_policy=preserve-requested-depth-v1$' runs/cpu-auto-ci/stdout.txt
          grep -q '^persistent_startup_includes_buffer_first_touch=true$' runs/cpu-auto-ci/stdout.txt
          grep -q '^topology_detection_ns=' runs/cpu-auto-ci/stdout.txt
          grep -q '^calibration_oracle_ns=' runs/cpu-auto-ci/stdout.txt
          grep -q '"schema": "galaxy.cpu-runtime-auto-receipt.v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"runtime": "galaxy-cpu"' runs/cpu-auto-ci/receipt.json
          grep -q '"execution_mode": "host-auto"' runs/cpu-auto-ci/receipt.json
          grep -q '"selection_policy": "calibrated-host-auto-v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"canonical_oracle": "streaming-canonical-bam-lut-v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"parity_fail_closed": true' runs/cpu-auto-ci/receipt.json
          grep -q '"promotion_margin_basis_points": 500' runs/cpu-auto-ci/receipt.json
          grep -q '"score_projection": "linear-particle-frame-v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"tile_shape_policy": "expand-resident-for-effective-tile-v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"frame_calibration_policy": "preserve-requested-depth-v1"' runs/cpu-auto-ci/receipt.json
          grep -q '"persistent_startup_includes_buffer_first_touch": true' runs/cpu-auto-ci/receipt.json
          grep -q '"topology_detection_ns":' runs/cpu-auto-ci/receipt.json
          grep -q '"calibration_work_units":' runs/cpu-auto-ci/receipt.json
          grep -q '"requested_work_units":' runs/cpu-auto-ci/receipt.json
          grep -q '"calibration_oracle_ns":' runs/cpu-auto-ci/receipt.json
          grep -q '"selected_schedule_fell_back_to_logical":' runs/cpu-auto-ci/receipt.json
          grep -q '"selected_tile_shape_match": true' runs/cpu-auto-ci/receipt.json
          grep -q '"checksum_match": true' runs/cpu-auto-ci/receipt.json
          python3 - <<'PY'
          import json
          with open('runs/cpu-auto-ci/receipt.json', encoding='utf-8') as handle:
              receipt = json.load(handle)
          assert receipt['tile_shape_policy'] == 'expand-resident-for-effective-tile-v1'
          assert receipt['frame_calibration_policy'] == 'preserve-requested-depth-v1'
          assert receipt['calibration_frames'] == receipt['frames']
          assert receipt['persistent_startup_includes_buffer_first_touch'] is True
          assert receipt['topology_detection_ns'] >= 0
          assert receipt['tuning_ns'] >= receipt['topology_detection_ns'] + receipt['calibration_oracle_ns']
          for candidate in receipt['calibration_candidates']:
              if candidate['tile_particles'] is not None:
                  assert candidate['tile_shape_match'] is True
                  assert candidate['calibration_effective_tile_particles'] == candidate['requested_effective_tile_particles']
              if candidate['effective_schedule'] is not None:
                  assert candidate['startup_includes_buffer_first_touch'] is True
          PY
          selected=$(sed -n 's/.*"selected_checksum": "\([0-9a-fA-F]*\)".*/\1/p' runs/cpu-auto-ci/receipt.json)
          oracle=$(sed -n 's/.*"oracle_checksum": "\([0-9a-fA-F]*\)".*/\1/p' runs/cpu-auto-ci/receipt.json)
          test -n "$selected"
          test "$selected" = "$oracle"

  windows-auto:
    name: Auto Windows x86-64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Verify native architecture
        shell: pwsh
        run: |
          $arch = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          if ($arch -ne 'X64') { throw "Expected native X64 runner" }
      - name: Test auto policy unit contracts
        shell: pwsh
        run: cargo test --manifest-path cpu-runtime/Cargo.toml --locked --offline
      - name: Verify auto CLI boundaries
        shell: pwsh
        run: |
          cargo build --manifest-path cpu-runtime/Cargo.toml --release --locked --offline
          $help = & 'cpu-runtime/target/release/galaxy-cpu.exe' --help
          if (-not ($help -match 'bench-auto')) { throw "galaxy-cpu help omitted bench-auto" }
          if (-not ($help -match 'expands resident work when needed so every advertised tile is measured')) { throw "top-level help omitted live tile-shape policy" }
          if (-not ($help -match 'preserves the requested frame depth during calibration')) { throw "top-level help omitted frame-depth policy" }
          if (-not ($help -match 'includes topology detection in tuning_ns')) { throw "top-level help omitted topology timing policy" }
          $autoHelp = cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-auto --help
          if ($LASTEXITCODE -ne 0) { throw "bench-auto --help failed" }
          if (-not ($autoHelp -match 'projects every calibration median to requested particle-frame work')) { throw "bench-auto help omitted score projection" }
          if (-not ($autoHelp -match 'expands resident work when needed so every advertised tile is measured')) { throw "bench-auto help omitted tile-shape policy" }
          if (-not ($autoHelp -match 'preserves the requested frame depth during calibration')) { throw "bench-auto help omitted frame-depth policy" }
          if (-not ($autoHelp -match 'including worker-local buffer first-touch')) { throw "bench-auto help omitted first-touch startup policy" }
          cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-auto --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "verify-auto --help failed" }
          foreach ($flag in @('--path','--tile','--schedule')) {
            $probe = Start-Process -FilePath cargo -ArgumentList @(
              'run','--manifest-path','cpu-runtime/Cargo.toml','--release','--locked','--offline',
              '--','bench-auto',$flag,'1'
            ) -NoNewWindow -Wait -PassThru
            if ($probe.ExitCode -eq 0) { throw "bench-auto unexpectedly accepted $flag" }
          }
      - name: Verify fail-closed auto selection
        shell: pwsh
        run: cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- verify-auto --workers 4
      - name: Run bounded auto receipt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runs/cpu-auto-ci | Out-Null
          $output = cargo run --manifest-path cpu-runtime/Cargo.toml --release --locked --offline -- bench-auto --logical 18446744073709551615 --resident 16384 --frames 2 --workers 4 --repeats 2 --seed 303 --receipt runs/cpu-auto-ci/receipt.json
          $output | Set-Content runs/cpu-auto-ci/stdout.txt
          $output
          $receipt = Get-Content runs/cpu-auto-ci/receipt.json -Raw | ConvertFrom-Json
          if ($receipt.schema -ne 'galaxy.cpu-runtime-auto-receipt.v1') { throw "auto receipt schema changed" }
          if ($receipt.runtime -ne 'galaxy-cpu') { throw "auto receipt runtime changed" }
          if ($receipt.execution_mode -ne 'host-auto') { throw "auto execution mode changed" }
          if ($receipt.selection_policy -ne 'calibrated-host-auto-v1') { throw "auto selection policy changed" }
          if ($receipt.canonical_oracle -ne 'streaming-canonical-bam-lut-v1') { throw "auto oracle changed" }
          if (-not $receipt.parity_fail_closed) { throw "auto policy lost fail-closed marker" }
          if ($receipt.promotion_margin_basis_points -ne 500) { throw "auto promotion margin changed" }
          if ($receipt.score_projection -ne 'linear-particle-frame-v1') { throw "auto score projection changed" }
          if ($receipt.tile_shape_policy -ne 'expand-resident-for-effective-tile-v1') { throw "auto tile-shape policy changed" }
          if ($receipt.frame_calibration_policy -ne 'preserve-requested-depth-v1') { throw "auto frame policy changed" }
          if ($receipt.calibration_frames -ne $receipt.frames) { throw "calibration did not preserve requested frame depth" }
          if (-not $receipt.persistent_startup_includes_buffer_first_touch) { throw "persistent first-touch startup marker missing" }
          if ($receipt.topology_detection_ns -lt 0) { throw "topology timing missing" }
          if ($receipt.calibration_oracle_ns -le 0) { throw "calibration oracle timing was not recorded" }
          if ($receipt.tuning_ns -lt ($receipt.topology_detection_ns + $receipt.calibration_oracle_ns)) { throw "tuning time excluded topology or calibration oracle" }
          if (-not $receipt.selected_tile_shape_match) { throw "selected tile shape did not match requested execution" }
          foreach ($candidate in @($receipt.calibration_candidates)) {
            if ($null -ne $candidate.tile_particles) {
              if (-not $candidate.tile_shape_match) { throw "candidate tile shape did not match requested execution" }
              if ($candidate.calibration_effective_tile_particles -ne $candidate.requested_effective_tile_particles) { throw "candidate effective tile fields diverged" }
            }
            if ($null -ne $candidate.effective_schedule -and -not $candidate.startup_includes_buffer_first_touch) {
              throw "persistent candidate omitted first-touch startup evidence"
            }
          }
          if (-not $receipt.checksum_match) { throw "auto selected checksum did not match oracle" }
          if ($receipt.selected_checksum -ne $receipt.oracle_checksum) { throw "auto checksum fields diverged" }

          # Windows currently has no physical-core detector in this runtime. Every
          # physical-first candidate must therefore report the logical fallback
          # instead of claiming a physical-core schedule was actually applied.
          $physical = @($receipt.calibration_candidates | Where-Object { $_.requested_schedule -eq 'physical-first' })
          if ($physical.Count -lt 1) { throw "auto receipt omitted physical-first candidate" }
          foreach ($candidate in $physical) {
            if ($candidate.effective_schedule -ne 'logical') { throw "physical-first fallback did not report logical execution" }
            if (-not $candidate.schedule_fell_back_to_logical) { throw "physical-first fallback marker missing" }
            if ($candidate.schedule -ne 'logical') { throw "compatibility schedule field was not effective schedule" }
          }
