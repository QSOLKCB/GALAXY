[package]
name = "galaxy-sampler"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Bounded deterministic star sampling for GALAXY"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
